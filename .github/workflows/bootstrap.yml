---
name: bootstrap
on: [push]  # yamllint disable-line rule:truthy
env:
  MISE_LOCKED: true
  GITHUB_TOKEN: ${{ github.token }}
jobs:
  bootstrap:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macOS-15, macOS-26, ubuntu-latest]
    steps:
      - name: Run bootstrap.sh
        # yamllint disable rule:line-length
        run: |
          GIT_BRANCH=$GITHUB_REF_NAME GIT_AUTHOR_NAME="GitHub Bot" GIT_AUTHOR_EMAIL="github-bot@noreply.com" \
            bash <(curl -fsSfL "https://raw.githubusercontent.com/gregfolker/dotfiles/$GITHUB_SHA/bootstrap.sh")
        shell: bash
      - name: Verify symlinks
        run: |
          source ~/.env
          cd ~/.config/mise
          mise activate --shims
          mise bootstrap dotfiles status --missing
        shell: bash
      - name: Verify neovim setup
        run: |
          mise activate --shims
          mise x -- nvim --headless "+checkhealth" +qa
        shell: bash
